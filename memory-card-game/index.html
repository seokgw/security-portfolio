<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="30초 안에 같은 그림을 찾는 메모리 카드 게임">
  <meta name="theme-color" content="#17142d">
  <title>PAIR UP! - 같은 그림 찾기</title>
  <link rel="stylesheet" href="./css/style.css">
  <script src="./js/game.js" defer></script>
</head>
<body>
  <main class="game-shell">
    <header class="hero">
      <div>
        <p class="eyebrow">30 SECOND MEMORY CHALLENGE</p>
        <h1><span>PAIR</span> UP!</h1>
        <p class="subtitle">같은 그림 찾기</p>
      </div>
      <section class="rules" aria-labelledby="rules-title">
        <h2 id="rules-title">게임 방법</h2>
        <ol>
          <li>카드 두 장을 선택하세요.</li>
          <li>같은 그림이면 <strong>100점</strong>을 얻습니다.</li>
          <li><strong>30초</strong> 안에 모든 쌍을 찾으면 성공!</li>
        </ol>
        <p>조작: 마우스로 카드를 클릭하세요.</p>
      </section>
    </header>

    <section class="stats-strip" aria-label="누적 기록">
      <div><span>BEST</span><strong id="best-score">0</strong></div>
      <div><span>PLAY</span><strong id="total-games">0</strong></div>
      <div><span>WIN</span><strong id="total-wins">0</strong></div>
    </section>

    <section class="game-panel" aria-label="게임 영역">
      <div class="difficulty-bar" aria-label="카드 수 선택">
        <span>난이도</span>
        <div id="difficulty-buttons" class="difficulty-buttons">
          <button type="button" data-pairs="6" aria-pressed="true">12장</button>
          <button type="button" data-pairs="8" aria-pressed="false">16장</button>
        </div>
        <small>선택하면 새 게임이 시작됩니다.</small>
      </div>

      <div class="live-status" aria-live="polite">
        <div class="metric time"><span>남은 시간</span><strong><b id="time-left">30</b>초</strong></div>
        <div class="metric"><span>점수</span><strong id="score">0</strong></div>
        <div class="metric"><span>찾은 카드</span><strong><b id="matched-pairs">0</b> / <b id="total-pairs">6</b></strong></div>
        <div class="metric state"><span>상태</span><strong id="game-status">게임 진행 중</strong></div>
      </div>

      <div class="board-wrap">
        <div id="pause-overlay" class="pause-overlay" hidden>
          <strong>PAUSED</strong>
          <span>게임이 일시정지되었습니다.</span>
        </div>
        <div id="game-board" class="game-board" aria-label="같은 그림 찾기 카드판"></div>
      </div>

      <div id="result" class="result" role="status" aria-live="assertive" hidden>
        <p id="result-kicker"></p>
        <h2 id="result-title"></h2>
        <p id="result-message"></p>
      </div>

      <div class="controls">
        <button id="pause-button" class="button secondary" type="button">일시정지</button>
        <button id="restart-button" class="button primary" type="button">다시 시작</button>
        <button id="reset-stats-button" class="button ghost" type="button">기록 초기화</button>
        <label class="motion-control"><input id="reduce-motion" type="checkbox"> 움직임 줄이기</label>
      </div>
    </section>
  </main>
</body>
</html>
